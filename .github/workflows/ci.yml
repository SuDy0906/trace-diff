name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      - name: Unit + integration tests
        run: cargo test --all-targets -- --nocapture
      - name: Headless smoke (L7)
        shell: bash
        run: |
          cargo run --quiet -- run https://example.com --skip-trace --headless --save-baseline ci-smoke --db ./ci.db
          cargo run --quiet -- list --db ./ci.db
          cargo run --quiet -- diff ci-smoke https://example.com --skip-trace --headless --db ./ci.db || true

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings || cargo clippy --all-targets


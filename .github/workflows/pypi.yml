name: pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  build-wheels:
    name: wheel (${{ matrix.os }}-${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install maturin
        run: pip install "maturin>=1.7,<2"

      - name: Build wheel (Linux manylinux)
        if: matrix.manylinux != ''
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: 2_28
          command: build
          args: --release --out dist -b bin

      - name: Build wheel
        if: matrix.manylinux == ''
        run: maturin build --release --out dist --target ${{ matrix.target }} -b bin

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  smoke-test:
    name: smoke (${{ matrix.os }})
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: wheel-windows-latest-x86_64-pc-windows-msvc
          - os: macos-latest
            artifact: wheel-macos-latest-aarch64-apple-darwin
          - os: ubuntu-latest
            artifact: wheel-ubuntu-latest-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wheel
        shell: bash
        run: pip install dist/*.whl
      - name: Smoke test
        shell: bash
        run: |
          trace-diff --version
          trace-diff --help | grep -q features
          trace-diff features --check-llm
          trace-diff features --check-llm --json | grep -q '"ready"'

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-wheels, smoke-test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --skip-existing dist/*.whl

name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should trace-diff behave?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Network probe (run / diff)
        - Features (OpenAPI workflows)
        - TUI / UX
        - CI / headless
        - Packaging / pip
        - Documentation
        - Other
    validations:
      required: true

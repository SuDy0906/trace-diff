[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "trace-test"
dynamic = ["version"]
description = "L3/L4 traceroute + L7 HTTP diagnostics CLI — trace routes and test API endpoints"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Suryadeep Singh", email = "imsuryadeepsingh0911@gmail.com" }]
keywords = ["network", "traceroute", "http", "diagnostics", "latency", "cli", "trace", "test"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: System :: Networking",
  "Topic :: System :: Monitoring",
  "Operating System :: OS Independent",
]

[tool.maturin]
manifest-path = "Cargo.toml"
bindings = "bin"

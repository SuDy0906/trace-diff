[package]
name = "trace-diff"
version = "0.1.2"
edition = "2021"
description = "Interactive terminal-native diagnostic CLI: L3/L4 traceroute + L7 HTTP lifecycle diffs and OpenAPI workflow testing"
license = "MIT"
readme = "README.md"
repository = "https://github.com/SuDy0906/trace-diff"
homepage = "https://github.com/SuDy0906/trace-diff"
documentation = "https://github.com/SuDy0906/trace-diff#readme"

[dependencies]
# CLI & Error Handling
clap = { version = "4.5", features = ["derive", "env"] }
miette = { version = "7.2", features = ["fancy"] }
thiserror = "1.0"
anyhow = "1.0"
color-eyre = "0.6"

# Async & Networking Core
tokio = { version = "1.38", features = ["full"] }
socket2 = { version = "0.5", features = ["all"] }
pnet_packet = "0.35"
surge-ping = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

# L7 Protocols & Profiling
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1", "http2"] }
h2 = "0.4.16"
hickory-resolver = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
http-body-util = "0.1"
bytes = "1.6"
x509-parser = "0.16"

# Storage & Serialization
rusqlite = { version = "0.31", features = ["bundled", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
uuid = { version = "1.10", features = ["v4", "serde"] }

# Terminal Interface
ratatui = { version = "0.28", features = ["all-widgets"] }
crossterm = "0.28"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
humantime = "2.1"
url = "2.5"

[[bin]]
name = "trace-diff"
path = "src/main.rs"

[package.metadata.maturin]
name = "trace_diff"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
insta = { version = "1.39", features = ["json"] }
wiremock = "0.6"
tokio-test = "0.4"
axum = "0.7"
proptest = "1.5"
tempfile = "3.10"
